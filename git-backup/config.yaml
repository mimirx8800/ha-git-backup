name: Git Config Backup Fixed
version: "1.0.25"
slug: git_config_backup_fixed
description: Automatically backup Home Assistant configuration to a Git repository
url: "https://github.com/mimirx8800/ha-git-backup"
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
startup: application
boot: auto
init: false

# Map the Home Assistant config directory (read-only for safety)
map:
  - config:ro
  - ssl:ro
  - addons:ro
  - share:rw

# Persistent storage for git repo clone and SSH keys
tmpfs: false

options:
  repository_url: ""
  branch: "main"
  username: ""
  password: ""
  ssh_key: ""
  auto_generate_ssh_key: false
  commit_message: "Backup: {files}"
  commit_user_name: "Home Assistant"
  commit_user_email: "homeassistant@local"
  backup_interval_hours: 24
  backup_on_start: false
  watch_realtime: false
  watch_min_interval: 30
  watch_max_interval: 1800
  watch_burst_limit: 5
  cron_schedule: ""
  exclude_patterns:
    - "*.db"
    - "*.db-shm"
    - "*.db-wal"
    - "*.log"
    - "home-assistant.log*"
    - "OZW_Log.txt"
    - "tts/*"
    - ".storage/*"
    - "backups/*"
    - ".cloud/*"
    - "secrets.yaml"
    - "zigbee2mqtt/*"
    - "esphome/secrets.yaml"
    - ".cache/*"
    - "esphome/.device-builder-peer-link-key.bin"
    - "esphome/.device-builder.json.lock"
    - "esphome/archive/*"
    - "www/tmp*.jpg"
    - "custom_components/*"
    - "www/*"
    - "themes/*"
    - "deps/*"
    - ".ha_run.lock"
  include_patterns:
    - "*.yaml"
    - "*.yml"
    - "*.py"
    - "*.jinja"
    - "*.j2"
    - "*.sh"
    - "*.conf"
    - "*.toml"
    - "blueprints/*"
    - "esphome/*"
    - "lovelace/*"
    - "packages/*"
    - "python_scripts/*"
    - "custom_templates/*"

schema:
  repository_url: str?
  branch: str
  username: str?
  password: password?
  ssh_key: password?
  auto_generate_ssh_key: bool
  commit_message: str
  commit_user_name: str
  commit_user_email: str
  backup_interval_hours: int(0,168)
  backup_on_start: bool
  watch_realtime: bool
  watch_min_interval: int(5,300)
  watch_max_interval: int(60,3600)
  watch_burst_limit: int(1,50)
  cron_schedule: str?
  exclude_patterns:
    - str
  include_patterns:
    - str

# Enable Ingress for web UI to view SSH public key and status
ingress: true
ingress_port: 8099
panel_icon: mdi:git
panel_title: Git Backup

# Access to Home Assistant API for triggering via services
homeassistant_api: true
hassio_api: true
hassio_role: homeassistant

# Labels

